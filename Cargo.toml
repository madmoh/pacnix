[package]
name = "pacnix"
version = "0.11.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
globset = "0.4.21"
libc = "0.2.191"
quick-xml = "0.42"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
strsim = "0.11"
walkdir = "2.5.0"
