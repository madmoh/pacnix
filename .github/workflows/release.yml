# A tag vX.Y.Z builds the pacnix and aurutils packages and publishes them as a
# release. The release files are a signed pacman repository with the name pacnix:
#   [pacnix]
#   Server = https://github.com/OWNER/pacnix/releases/latest/download
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed git cargo github-cli
      # A plain clone: actions/checkout is a JavaScript action that needs Node.js.
      - name: Get the source of the tag
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Check that the tag, PKGBUILD and Cargo.toml have the same version
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "pkgver=$v" PKGBUILD
          grep -qx "version = \"$v\"" Cargo.toml
      - name: Build the packages
        run: |
          useradd -m builder
          chown -R builder .
          # makepkg uses src/ and pkg/ of the checkout unless BUILDDIR is elsewhere.
          runuser -u builder -- env BUILDDIR=/tmp/makepkg PKGDEST="$PWD" makepkg --nodeps --noconfirm
          runuser -u builder -- pkg/aurutils "$PWD"
      - name: Sign the packages and make the repository
        env:
          SIGNING_KEY: ${{ secrets.PACNIX_SIGNING_KEY }}
        run: |
          gpg --batch --import <<<"$SIGNING_KEY"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          mkdir release
          for pkg in pacnix-*.pkg.tar.zst aurutils-*.pkg.tar.zst; do
            gpg --batch --detach-sign --local-user "$key" "$pkg"
            repo-add --sign --key "$key" pacnix.db.tar.gz "$pkg"
            cp "$pkg" "$pkg.sig" release/
          done
          cp -L pacnix.db pacnix.db.sig pacnix.files pacnix.files.sig release/
          gpg --armor --export "$key" > release/pacnix.asc
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
