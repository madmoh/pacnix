# Each day, puts the latest aurutils release of GitHub into the latest pacnix
# release, so that [pacnix] gives the latest aurutils also between releases.
name: aurutils
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aurutils:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the tools
        run: pacman -Syu --noconfirm --needed git github-cli
      - name: Get the source
        run: git clone --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Build aurutils if the latest release does not have it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m builder
          mkdir out
          gh release download --pattern 'aurutils-*.pkg.tar.zst' --dir out
          chown -R builder .
          runuser -u builder -- pkg/aurutils "$PWD/out"
      - name: Sign it and update the repository of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PACNIX_SIGNING_KEY }}
        run: |
          cd out
          gh release view --json assets --jq '.assets[].name' > assets
          pkg=$(ls aurutils-*.pkg.tar.zst)
          if grep -qx "$pkg" assets; then
            echo "the latest release has $pkg"
            exit 0
          fi
          gpg --batch --import <<<"$SIGNING_KEY"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gh release download --pattern 'pacnix.db' --pattern 'pacnix.files'
          mv pacnix.db pacnix.db.tar.gz
          mv pacnix.files pacnix.files.tar.gz
          gpg --batch --detach-sign --local-user "$key" "$pkg"
          repo-add --sign --key "$key" pacnix.db.tar.gz "$pkg"
          mkdir upload
          cp -L "$pkg" "$pkg.sig" pacnix.db pacnix.db.sig pacnix.files pacnix.files.sig upload/
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" upload/* --clobber
          for old in $(grep '^aurutils-' assets); do
            gh release delete-asset "$tag" "$old" --yes
          done
